<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f111a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        #banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #e67e22;
            color: white;
            padding: 8px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .card {
            background: #1a1c29;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 8px; color: #7f5af0; }
        p.subtitle { color: #94a1b2; font-size: 0.95rem; margin-bottom: 24px; }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a1b2;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: 2px solid #2cb67d;
            background: #0f111a;
            color: white;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }
        input.name-input {
            text-transform: none;
            border-color: #7f5af0;
        }
        input:focus {
            box-shadow: 0 0 10px rgba(127,90,240,0.5);
        }
        .btn {
            width: 100%;
            background: #2cb67d;
            color: #0f111a;
            border: none;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .error-box {
            display: none;
            background: #e74c3c;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 0.9rem;
        }
        .error-box button {
            margin-top: 8px;
            padding: 6px 14px;
            background: white;
            color: #e74c3c;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        /* Waiting Lobby Screen */
        #waitingScreen { display: none; }
        .pulse-circle {
            width: 80px;
            height: 80px;
            margin: 30px auto;
            border-radius: 50%;
            background: #7f5af0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(127,90,240,0.7); }
            70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 20px rgba(127,90,240,0); }
            100% { transform: scale(0.9); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="banner">⚠️ Reconnecting to server...</div>

    <div class="container">
        <!-- JOIN SCREEN -->
        <div id="joinScreen" class="card">
            <h1>Join Live Quiz</h1>
            <p class="subtitle">Enter the room code shown on the screen</p>

            <div id="errorBox" class="error-box">
                <div id="errorMessage"></div>
                <button id="retryBtn">Retry</button>
            </div>

            <div class="form-group">
                <label for="roomCodeInput">Room Code</label>
                <input id="roomCodeInput" type="text" maxlength="6" placeholder="e.g. ABCD" autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="playerNameInput">Your Nickname</label>
                <input id="playerNameInput" class="name-input" type="text" maxlength="20" placeholder="e.g. Alex" autocomplete="off" />
            </div>

            <button id="joinBtn" class="btn">Enter Quiz</button>
        </div>

        <!-- WAITING LOBBY SCREEN -->
        <div id="waitingScreen" class="card">
            <h1 style="color: #2cb67d;">You're In!</h1>
            <p id="welcomeName" style="font-size: 1.3rem; margin: 10px 0; color: #fff;"></p>
            <div class="pulse-circle"></div>
            <p style="color: #94a1b2;">Look up at the screen.<br>Waiting for host to start...</p>
        </div>
    </div>

    <script>
        const joinScreen = document.getElementById('joinScreen');
        const waitingScreen = document.getElementById('waitingScreen');
        const roomCodeInput = document.getElementById('roomCodeInput');
        const playerNameInput = document.getElementById('playerNameInput');
        const joinBtn = document.getElementById('joinBtn');
        const errorBox = document.getElementById('errorBox');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const welcomeName = document.getElementById('welcomeName');
        const banner = document.getElementById('banner');

        // Check if room code was passed via URL query parameter (e.g. ?room=ABCD)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            roomCodeInput.value = urlParams.get('room').toUpperCase();
        }

        // Restore saved player session if available
        const savedPlayerId = localStorage.getItem('quiz_playerId');
        const savedRoomCode = localStorage.getItem('quiz_roomCode');
        const savedPlayerName = localStorage.getItem('quiz_playerName');

        if (savedPlayerId && savedRoomCode && savedPlayerName) {
            showWaiting(savedPlayerName);
        }

        function showError(msg, retryFn) {
            errorMessage.textContent = msg;
            errorBox.style.display = 'block';
            retryBtn.onclick = () => {
                errorBox.style.display = 'none';
                if (retryFn) retryFn();
            };
        }

        function clearError() {
            errorBox.style.display = 'none';
        }

        function showWaiting(name) {
            joinScreen.style.display = 'none';
            waitingScreen.style.display = 'block';
            welcomeName.textContent = name;
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw new Error("Couldn't connect. Check your internet.");
            }
        }

        async function handleJoin() {
            clearError();
            const code = roomCodeInput.value.trim().toUpperCase();
            const name = playerNameInput.value.trim();

            if (!code) {
                showError("Please enter a room code.", handleJoin);
                return;
            }
            if (!name) {
                showError("Please enter a nickname.", handleJoin);
                return;
            }

            joinBtn.disabled = true;
            joinBtn.textContent = "Joining...";

            try {
                const res = await fetchWithTimeout(`/api/rooms/${encodeURIComponent(code)}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Failed to join room.");
                }

                // Store credentials locally for survivability on refresh
                localStorage.setItem('quiz_playerId', data.playerId);
                localStorage.setItem('quiz_roomCode', data.roomCode);
                localStorage.setItem('quiz_playerName', name);

                showWaiting(name);
            } catch (err) {
                showError(err.message, handleJoin);
            } finally {
                joinBtn.disabled = false;
                joinBtn.textContent = "Enter Quiz";
            }
        }

        joinBtn.onclick = handleJoin;

        // Allow pressing Enter key to submit
        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleJoin();
        });
        roomCodeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') playerNameInput.focus();
        });
    </script>
</body>
</html>
